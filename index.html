<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NIGHTSHADE MOTEL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: #d0d0d0; touch-action: none; }
        
        /* 3D Canvas */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* Effects */
        #vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; box-shadow: inset 0 0 250px rgba(0,0,0,0.98); }
        #sanity-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; background: radial-gradient(circle, transparent 30%, rgba(120,0,0,0.5) 100%); opacity: 0; transition: opacity 1s; }
        #film-grain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; opacity: 0.15; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        #blood-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(circle, transparent 20%, rgba(150,0,0,0.8) 100%); opacity: 0; transition: opacity 0.5s; }

        /* HUD Layer */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: none; }
        #hud.active { display: block; }

        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); transition: all 0.2s; box-shadow: 0 0 5px rgba(0,0,0,0.8); }
        #crosshair.interactable { width: 14px; height: 14px; background: rgba(255, 30, 30, 0.9); box-shadow: 0 0 20px rgba(255, 30, 30, 0.9); }

        /* Mobile Controls */
        #joy-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.02); border: 2px solid rgba(255,255,255,0.08); pointer-events: auto; backdrop-filter: blur(5px); }
        #joy-knob { position: absolute; width: 56px; height: 56px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; top: 37px; left: 37px; transition: transform 0.05s; box-shadow: 0 0 15px rgba(0,0,0,0.6); }
        
        #look-zone { position: absolute; top: 0; right: 0; width: 60%; height: 100%; pointer-events: auto; }

        /* Action Buttons Layout */
        #btn-group { position: absolute; bottom: 40px; right: 40px; width: 180px; height: 180px; pointer-events: none; }
        .btn { pointer-events: auto; position: absolute; display: flex; align-items: center; justify-content: center; background: rgba(10,10,15,0.7); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(10px); transition: all 0.1s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .btn:active { transform: scale(0.9); background: rgba(60,60,70,0.9); }
        .btn svg { width: 32px; height: 32px; fill: #a0a0a0; transition: all 0.2s; }
        
        #btn-interact { width: 85px; height: 85px; border-radius: 50%; bottom: 0; right: 0; border-color: rgba(200, 30, 30, 0.5); background: rgba(40, 10, 10, 0.8); }
        #btn-interact svg { width: 45px; height: 45px; fill: #ff4a4a; }
        #btn-interact.glow { box-shadow: 0 0 30px rgba(255, 50, 50, 0.8); border-color: #ff4a4a; }
        
        #btn-flashlight { width: 60px; height: 60px; border-radius: 50%; bottom: 90px; right: 10px; }
        #btn-flashlight.active svg { fill: #fff; filter: drop-shadow(0 0 10px #fff); }
        #btn-inventory { width: 60px; height: 60px; border-radius: 50%; bottom: 10px; right: 90px; }

        /* UI Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; display: none; align-items: center; justify-content: center; pointer-events: auto; padding: 20px; padding-bottom: env(safe-area-inset-bottom, 20px); }
        .modal.active { display: flex; }
        
        /* Document Modal */
        .paper-container { position: relative; width: 100%; max-width: 700px; max-height: 80vh; display: flex; flex-direction: column; }
        .paper { background: #dcd5c0; color: #111; padding: 30px; width: 100%; height: 100%; overflow-y: auto; font-family: 'Special Elite', monospace; font-size: 18px; line-height: 1.6; box-shadow: inset 0 0 60px rgba(0,0,0,0.2), 0 20px 50px rgba(0,0,0,0.9); border-radius: 2px; }
        .paper h2 { font-size: 24px; border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        
        /* FIXED CLOSE BUTTON */
        .btn-close-ui { position: fixed; top: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: rgba(200,30,30,0.8); border: 2px solid #ff6666; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.8); z-index: 999; backdrop-filter: blur(5px); }
        .btn-close-ui:active { background: #ff0000; transform: scale(0.9); }

        /* Dialogue Style */
        .dialogue-box { background: rgba(10,10,15,0.95); border: 1px solid #333; border-left: 5px solid #8a1f1f; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border-radius: 4px; }
        .speaker-name { color: #c03030; font-size: 22px; font-weight: 800; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; font-family: 'Special Elite', monospace;}
        .dialogue-text { font-size: 18px; line-height: 1.6; color: #ccc; margin-bottom: 30px; }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #aaa; padding: 15px 20px; text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; border-radius: 4px; }
        .choice-btn:active { background: rgba(138,31,31,0.3); border-color: #c03030; color: #fff; }

        /* Start Screen */
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #start-title { font-family: 'Special Elite', monospace; font-size: 64px; letter-spacing: 4px; color: #fff; text-shadow: 0 0 40px rgba(200,30,30,0.5); margin-bottom: 10px; }
        #start-sub { font-size: 14px; color: #9b2929; letter-spacing: 8px; margin-bottom: 50px; text-transform: uppercase; font-weight: 600; }
        .start-btn { background: transparent; border: 1px solid #666; color: #ccc; padding: 15px 40px; font-size: 18px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .start-btn:active { background: #8a1f1f; color: #fff; border-color: #8a1f1f; }

        /* Blood Splatter Canvas on screen */
        #blood-overlay { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:90; opacity:0; transition:opacity 1s; background: radial-gradient(circle at center, rgba(150,0,0,0) 30%, rgba(100,0,0,0.8) 100%); }

        @media (orientation: portrait) { #portrait-warning { display: flex !important; } }
        #portrait-warning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="portrait-warning">
    <h2 style="color:#fff; margin-bottom:10px;">Поверните телефон</h2>
    <p style="color:#666; font-size:14px;">Для игры нужен горизонтальный режим</p>
</div>

<div id="start-screen">
    <div id="start-title">NIGHTSHADE</div>
    <div id="start-sub">MOTEL · GREYHAVEN · 1998</div>
    <button class="start-btn" id="btn-start">ПРИНЯТЬ СМЕНУ</button>
    <div style="margin-top:30px; font-size:12px; color:#555; max-width:300px; text-align:center;">
        ВНИМАНИЕ: Игра содержит сцены насилия (18+), кровь и психологическое давление. Наденьте наушники.
    </div>
</div>

<canvas id="game-canvas"></canvas>

<div id="vignette"></div>
<div id="film-grain"></div>
<div id="sanity-effect"></div>
<div id="blood-overlay"></div>

<div id="hud">
    <div id="crosshair"></div>
    
    <div id="joy-zone"><div id="joy-knob"></div></div>
    <div id="look-zone"></div>
    
    <div id="btn-group">
        <button class="btn" id="btn-interact">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
        <button class="btn active" id="btn-flashlight">
            <svg viewBox="0 0 24 24"><path d="M18 2H6v6l2 3v11h8V11l2-3V2zm-2 6.4V4h-8v4.4l-2 3V20h12v-8.6l-2-3zM9 18h6v2H9z"/></svg>
        </button>
        <button class="btn" id="btn-inventory">
            <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H7v4H4v12h16V8zm-9-2h2v2h-2V6zm7 12H6v-4h12v4zm0-6H6v-4h12v4z"/></svg>
        </button>
    </div>
</div>

<!-- Document Modal -->
<div class="modal" id="modal-doc">
    <div class="btn-close-ui" id="btn-close-doc">×</div>
    <div class="paper-container">
        <div class="paper" id="doc-content"></div>
    </div>
</div>

<!-- Dialogue Modal -->
<div class="modal" id="modal-dialogue">
    <div class="dialogue-box">
        <div class="speaker-name" id="dlg-speaker">Гостья</div>
        <div class="dialogue-text" id="dlg-text">...</div>
        <div class="choices" id="dlg-choices"></div>
    </div>
</div>

<!-- Inventory Modal -->
<div class="modal" id="modal-inventory">
    <div class="dialogue-box">
        <div class="speaker-name">ВЕЩИ В КАРМАНАХ</div>
        <div class="choices" id="inv-list" style="margin-bottom:20px;"></div>
        <button class="choice-btn" id="btn-close-inv" style="text-align:center;">ЗАКРЫТЬ</button>
    </div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';

// ============================================================================
// 1. GLOBAL STATE & AUDIO (ПРОКАЧАННЫЙ ЗВУК)
// ============================================================================
const STATE = {
    started: false, paused: false, sanity: 100, inventory: [],
    flags: { knifeEquipped: false, guestKilled: false, guestInvited: false },
    yaw: 0, pitch: 0,
    velocity: new THREE.Vector3(), // Для плавности ходьбы
    bobTime: 0,
    stepTimer: 0
};

const AudioSys = {
    ctx: null,
    rainNode: null,
    init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        
        // Принудительное включение на iOS
        if (this.ctx.state === 'suspended') this.ctx.resume();

        // Фоновый дождь
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        this.rainNode = this.ctx.createBufferSource();
        this.rainNode.buffer = buffer;
        this.rainNode.loop = true;
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 800;
        const gain = this.ctx.createGain(); gain.gain.value = 0.15;
        
        this.rainNode.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        this.rainNode.start();

        // Зловещий гул
        const osc = this.ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = 40;
        const dGain = this.ctx.createGain(); dGain.gain.value = 0.05;
        osc.connect(dGain); dGain.connect(this.ctx.destination); osc.start();
    },
    playTone(freq, type, duration, vol) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    footstep() { this.playTone(60 + Math.random()*20, 'triangle', 0.15, 0.15); },
    click() { this.playTone(1000, 'square', 0.05, 0.03); },
    stab() {
        this.playTone(150, 'sawtooth', 0.2, 0.4);
        setTimeout(() => this.playTone(80, 'square', 0.4, 0.3), 50);
    },
    knock() {
        for(let i=0; i<3; i++) setTimeout(() => this.playTone(100, 'square', 0.1, 0.2), i*300);
    }
};

// ============================================================================
// 2. THREE.JS SETUP & POST-PROCESSING
// ============================================================================
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020202, 0.08); // Густой туман
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 50);
camera.position.set(0, 1.6, 4);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// Постобработка: Bloom и Пленка
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
bloomPass.threshold = 0.2; bloomPass.strength = 0.8; bloomPass.radius = 0.5;
composer.addPass(bloomPass);
composer.addPass(new FilmPass(0.4, 0.05, 648.0, false));

// ============================================================================
// 3. WORLD GENERATION (МОТЕЛЬ)
// ============================================================================
function createBloodTexture() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,512,512);
    ctx.fillStyle = '#5a0000';
    ctx.beginPath(); ctx.arc(256, 256, 100, 0, Math.PI*2); ctx.fill();
    // Брызги
    for(let i=0; i<50; i++) {
        const x = 256 + (Math.random()-0.5)*300;
        const y = 256 + (Math.random()-0.5)*300;
        const r = Math.random()*15;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    return tex;
}

function createWallTexture() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 256;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0,0,256,256);
    ctx.fillStyle = '#222'; for(let i=0; i<100; i++) ctx.fillRect(Math.random()*256, Math.random()*256, Math.random()*20, Math.random()*20);
    return new THREE.CanvasTexture(c);
}

const MATS = {
    wall: new THREE.MeshStandardMaterial({ map: createWallTexture(), roughness: 0.9 }),
    floor: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0 }),
    wood: new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.7 }),
    blood: new THREE.MeshStandardMaterial({ map: createBloodTexture(), transparent: true, roughness: 0.2 }),
    metal: new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.4, metalness: 0.8 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x88bbdd, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.3 })
};

const colliders = [];
const interactables = [];

function addBox(w, h, d, mat, x, y, z, isCollider = true) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    if(isCollider) colliders.push(new THREE.Box3().setFromObject(mesh));
    return mesh;
}

// --- Архитектура: Ресепшен + Коридор ---
// Пол
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 30), MATS.floor);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// Стены ресепшена (вы находитесь за стойкой)
addBox(8, 4, 0.5, MATS.wall, 0, 2, 0); // Задняя стена
addBox(0.5, 4, 8, MATS.wall, -4, 2, 4); // Левая
addBox(0.5, 4, 8, MATS.wall, 4, 2, 4); // Правая
addBox(8, 4, 0.5, MATS.wall, 0, 2, 8); // Стена с дверью (коридор)

// Стойка регистрации
addBox(5, 1.2, 1, MATS.wood, 0, 0.6, 2.5);

// Дверь в коридор
const doorMesh = addBox(1.5, 2.5, 0.2, MATS.wood, 0, 1.25, 7.8);
interactables.push({ mesh: doorMesh, type: 'door' });

// Окно (за ним дождь и тьма)
const windowMesh = addBox(0.1, 2, 3, MATS.glass, -3.9, 2, 4, false);
// Свет снаружи (тусклый)
const moonLight = new THREE.DirectionalLight(0x3355aa, 0.5);
moonLight.position.set(-10, 5, 0); scene.add(moonLight);

// Детали на столе: Книга регистрации, Нож
const bookMesh = addBox(0.6, 0.05, 0.4, new THREE.MeshStandardMaterial({color: 0xeeddcc}), 1, 1.22, 2.5, false);
interactables.push({ mesh: bookMesh, type: 'book' });

const knifeMesh = addBox(0.05, 0.4, 0.05, MATS.metal, 2, 1.25, 2.5, false); // Клинок
knifeMesh.rotation.x = Math.PI/2;
interactables.push({ mesh: knifeMesh, type: 'knife' });

// --- Свет в комнате ---
scene.add(new THREE.AmbientLight(0x111122, 0.4));
// Настольная лампа
const lampLight = new THREE.PointLight(0xffaa55, 2, 8);
lampLight.position.set(-2, 2, 2); lampLight.castShadow = true; scene.add(lampLight);
const lampMesh = addBox(0.2, 0.2, 0.2, new THREE.MeshStandardMaterial({color:0xffccaa, emissive:0xff8822}), -2, 1.2, 2.5, false);

// --- ФОНАРЬ ИГРОКА (ЯРКИЙ) ---
const flashlight = new THREE.SpotLight(0xffffff, 15, 25, Math.PI/5, 0.4, 1); // ОЧЕНЬ ЯРКИЙ
flashlight.castShadow = true; flashlight.shadow.mapSize.width = 1024; flashlight.shadow.bias = -0.001;
camera.add(flashlight); flashlight.position.set(0.2, -0.1, 0); flashlight.target.position.set(0, 0, -1); camera.add(flashlight.target);
scene.add(camera);

// --- NPC (Гостья за дверью) ---
// Создаем силуэт за стеклом двери
const npcSilhouette = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.8, 8), new THREE.MeshStandardMaterial({color: 0x000000}));
npcSilhouette.position.set(0, 0.9, 9.5);
scene.add(npcSilhouette);

// Кровь на полу (появится позже)
const bloodDecal = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), MATS.blood);
bloodDecal.rotation.x = -Math.PI/2; bloodDecal.position.set(0, 0.01, 5);
bloodDecal.visible = false;
scene.add(bloodDecal);

// ============================================================================
// 4. CONTROLS
// ============================================================================
const keys = { w: false, a: false, s: false, d: false };
let joyId = null, joyX = 0, joyY = 0, lookId = null, lastX = 0, lastY = 0;

window.addEventListener('keydown', e => {
    if(e.key.toLowerCase() === 'w') keys.w = true; if(e.key.toLowerCase() === 's') keys.s = true;
    if(e.key.toLowerCase() === 'a') keys.a = true; if(e.key.toLowerCase() === 'd') keys.d = true;
    if(e.key.toLowerCase() === 'f') toggleLight(); if(e.key.toLowerCase() === 'e') doInteract();
});
window.addEventListener('keyup', e => {
    if(e.key.toLowerCase() === 'w') keys.w = false; if(e.key.toLowerCase() === 's') keys.s = false;
    if(e.key.toLowerCase() === 'a') keys.a = false; if(e.key.toLowerCase() === 'd') keys.d = false;
});

const joyZone = document.getElementById('joy-zone'), joyKnob = document.getElementById('joy-knob');
joyZone.addEventListener('touchstart', e => { e.preventDefault(); joyId = e.changedTouches[0].identifier; }, {passive: false});
joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for(let t of e.changedTouches) if(t.identifier === joyId) {
        const rect = joyZone.getBoundingClientRect();
        let dx = t.clientX - (rect.left + rect.width/2), dy = t.clientY - (rect.top + rect.height/2);
        const max = rect.width/2, dist = Math.hypot(dx, dy);
        if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyX = dx/max; joyY = dy/max;
    }
}, {passive: false});
joyZone.addEventListener('touchend', e => {
    for(let t of e.changedTouches) if(t.identifier === joyId) { joyId = null; joyX = 0; joyY = 0; joyKnob.style.transform = `translate(0px, 0px)`; }
});

const lookZone = document.getElementById('look-zone');
lookZone.addEventListener('touchstart', e => { e.preventDefault(); lookId = e.changedTouches[0].identifier; lastX = e.changedTouches[0].clientX; lastY = e.changedTouches[0].clientY; }, {passive: false});
lookZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for(let t of e.changedTouches) if(t.identifier === lookId) {
        STATE.yaw -= (t.clientX - lastX) * 0.005; STATE.pitch -= (t.clientY - lastY) * 0.005;
        STATE.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, STATE.pitch));
        lastX = t.clientX; lastY = t.clientY;
    }
}, {passive: false});
lookZone.addEventListener('touchend', e => { for(let t of e.changedTouches) if(t.identifier === lookId) lookId = null; });

// ============================================================================
// 5. INTERACTION
// ============================================================================
const raycaster = new THREE.Raycaster(); raycaster.far = 4.0;
const center = new THREE.Vector2(0, 0);
let activeItem = null;
const crosshair = document.getElementById('crosshair');
const btnInteract = document.getElementById('btn-interact');

function checkInteraction() {
    if(!STATE.started || STATE.paused) return;
    raycaster.setFromCamera(center, camera);
    const hits = raycaster.intersectObjects(interactables.map(i => i.mesh));

    if(hits.length > 0 && camera.position.distanceTo(hits[0].point) < 4.0) {
        const item = interactables.find(i => i.mesh === hits[0].object);
        if(item) {
            activeItem = item;
            crosshair.classList.add('interactable');
            btnInteract.classList.add('glow');
            return;
        }
    }
    activeItem = null;
    crosshair.classList.remove('interactable');
    btnInteract.classList.remove('glow');
}

function doInteract() {
    if(!activeItem) return;
    AudioSys.click();

    if(activeItem.type === 'book') {
        showDocument('Журнал регистрации', 'Последняя запись: "Номер 1 - Свободен".<br><br>Но ты точно помнишь, что вчера кто-то заселялся. Ты помнишь крик. Ты помнишь, как Мать сказала: "Она не должна была видеть".<br><br>Где ключ от первого номера?');
    } 
    else if(activeItem.type === 'knife') {
        STATE.flags.knifeEquipped = true;
        STATE.inventory.push({name: 'Окровавленный нож', desc: 'Холодная сталь. Мать одобряет.'});
        knifeMesh.visible = false;
        showDocument('Нож', 'Ты берешь нож. Тяжесть в руке успокаивает. Если она узнает правду, придется действовать.');
        triggerSanityDrop(10);
    }
    else if(activeItem.type === 'door') {
        if(!STATE.flags.guestInvited) {
            STATE.flags.guestInvited = true;
            // Стук в дверь
            AudioSys.knock();
            setTimeout(() => {
                showDialog('Гостья', 'Здравствуйте... У меня заглохла машина на шоссе. Связи нет. Мне очень страшно, на улице льет как из ведра. Можно я пережду у вас до утра? Я заплачу.', [
                    { text: 'Впустить её (Номер 1)', action: () => { openDoorEvent(); } },
                    { text: 'Прогнать её ("Мотель закрыт")', action: () => { 
                        showDocument('Гостья', 'Она смотрит на тебя с ужасом. "Пожалуйста... Он идет за мной". Она уходит в темноту. Ты слышишь крик вдалеке. Но это не твоя проблема.');
                        npcSilhouette.visible = false;
                        triggerSanityDrop(5);
                    }},
                    { text: 'Открыть дверь с ножом', action: () => { 
                        if(STATE.flags.knifeEquipped) triggerMurder();
                        else { showDocument('Дверь', 'Ты открываешь дверь. Она входит. Ты закрываешь её.'); openDoorEvent(); }
                    }}
                ]);
            }, 2000);
        } else {
            showDocument('Дверь', 'Ты уже открыл её сегодня. Она в комнате.');
        }
    }
}

function openDoorEvent() {
    npcSilhouette.visible = false;
    showDocument('Коридор', 'Ты ведешь её в комнату. В зеркале коридора ты видишь её лицо. Оно кажется тебе знакомым. Слишком знакомым.<br><br>Мать шепчет: "Она знает. Она видела. Закончи это".');
    triggerSanityDrop(20);
}

function triggerMurder() {
    STATE.started = false;
    AudioSys.stab();
    document.getElementById('blood-overlay').style.opacity = 1;
    document.getElementById('blood-flash').style.opacity = 1;
    npcSilhouette.visible = false;
    bloodDecal.visible = true;
    
    setTimeout(() => {
        document.getElementById('blood-flash').style.opacity = 0;
        document.getElementById('end-title').innerText = 'КРОВЬ НА РУКАХ';
        document.getElementById('end-text').innerText = 'Ты вытираешь нож об её пальто. Мать довольна. Но теперь тебе нужно спрятать тело в болоте за мотелем. Иначе полиция приедет раньше рассвета.';
        document.getElementById('end-screen').style.display = 'flex';
    }, 3000);
}

// ============================================================================
// 6. UI LOGIC
// ============================================================================
function showDocument(title, text) {
    STATE.paused = true;
    document.getElementById('doc-content').innerHTML = `<h2>${title}</h2><p>${text}</p>`;
    document.getElementById('modal-doc').classList.add('active');
}
document.getElementById('btn-close-doc').addEventListener('click', () => { 
    document.getElementById('modal-doc').classList.remove('active'); 
    STATE.paused = false; 
});

function showDialog(speaker, text, choices) {
    STATE.paused = true;
    document.getElementById('dlg-speaker').innerText = speaker;
    document.getElementById('dlg-text').innerHTML = text;
    const c = document.getElementById('dlg-choices'); c.innerHTML = '';
    choices.forEach(ch => {
        const b = document.createElement('button'); b.className = 'choice-btn'; b.innerText = ch.text;
        b.onclick = () => { document.getElementById('modal-dialogue').classList.remove('active'); if(ch.action) ch.action(); STATE.paused = false; };
        c.appendChild(b);
    });
    document.getElementById('modal-dialogue').classList.add('active');
}

function triggerSanityDrop(amount) {
    STATE.sanity -= amount;
    document.getElementById('sanity-effect').style.opacity = (100 - STATE.sanity) / 100;
    AudioSys.playTone(80, 'sawtooth', 2, 0.1);
}

document.getElementById('btn-interact').addEventListener('touchstart', e => { e.preventDefault(); doInteract(); });
document.getElementById('btn-flashlight').addEventListener('touchstart', e => { e.preventDefault(); toggleLight(); });
document.getElementById('btn-inventory').addEventListener('touchstart', e => {
    e.preventDefault(); STATE.paused = true;
    const list = document.getElementById('inv-list'); list.innerHTML = '';
    if(STATE.inventory.length === 0) list.innerHTML = '<div style="color:#555">Карманы пусты</div>';
    else STATE.inventory.forEach(i => list.innerHTML += `<div class="choice-btn" style="cursor:default; border-color:#333;"><b>${i.name}</b><br><small style="color:#999">${i.desc}</small></div>`);
    document.getElementById('modal-inventory').classList.add('active');
});
document.getElementById('btn-close-inv').addEventListener('click', () => { document.getElementById('modal-inventory').classList.remove('active'); STATE.paused = false; });

function toggleLight() {
    flashlight.visible = !flashlight.visible;
    document.getElementById('btn-flashlight').classList.toggle('active', flashlight.visible);
    AudioSys.click();
}

// ============================================================================
// 7. GAME LOOP (С ПЛАВНОЙ ФИЗИКОЙ)
// ============================================================================
let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now(), dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if(STATE.started && !STATE.paused) {
        let moveX = (keys.d?1:0) - (keys.a?1:0) + joyX;
        let moveZ = (keys.s?1:0) - (keys.w?1:0) + joyY;
        const len = Math.hypot(moveX, moveZ);
        if(len > 1) { moveX /= len; moveZ /= len; }

        const speed = 4.0;
        const forward = new THREE.Vector3(-Math.sin(STATE.yaw), 0, -Math.cos(STATE.yaw));
        const right = new THREE.Vector3(Math.cos(STATE.yaw), 0, -Math.sin(STATE.yaw));
        
        // Целевая скорость
        const targetVel = new THREE.Vector3()
            .addScaledVector(forward, -moveZ * speed)
            .addScaledVector(right, moveX * speed);

        // Плавная интерполяция скорости (инерция)
        STATE.velocity.lerp(targetVel, dt * 10);

        const newPos = camera.position.clone().addScaledVector(STATE.velocity, dt);
        
        // Проверка коллизий (упрощенная)
        const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(newPos.x, 1.0, newPos.z), new THREE.Vector3(0.5, 2.0, 0.5));
        let collided = false;
        for(let box of colliders) if(pBox.intersectsBox(box)) { collided = true; break; }

        if(!collided) {
            camera.position.x = newPos.x; camera.position.z = newPos.z;
            
            // Реалистичный шаг (Head Bobbing)
            if(STATE.velocity.length() > 0.5) {
                STATE.bobTime += dt * 15;
                STATE.stepTimer -= dt;
                if(STATE.stepTimer <= 0) { AudioSys.footstep(); STATE.stepTimer = 0.45; }
            }
        }

        // Применение позиции и наклона камеры
        camera.position.y = 1.6 + Math.sin(STATE.bobTime) * 0.04;
        camera.rotation.set(0, 0, 0); 
        camera.rotateY(STATE.yaw); 
        camera.rotateX(STATE.pitch);

        checkInteraction();
    }
    composer.render();
}

// ============================================================================
// 8. INIT
// ============================================================================
document.getElementById('btn-start').addEventListener('click', () => {
    // Активация звука (Требование iOS)
    AudioSys.init();
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud').classList.add('active');
    STATE.started = true;
    
    // Скриптовая сцена: Стук в дверь через 4 секунды
    setTimeout(() => {
        AudioSys.knock();
        showDocument('Ночь. Мотель.', 'Льет дождь. Ты за стойкой регистрации. В дверь стучат. На улице стоит девушка, она промокла насквозь. Она выглядит испуганной.<br><br>Голос Матери в твоей голове: "Не впускай её. Она принесла беду".');
        npcSilhouette.visible = true; // Появление силуэта
    }, 4000);
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
});

// Кнопка перезапуска (в конце)
document.getElementById('end-screen').innerHTML += '<button class="start-btn" style="margin-top:30px;" onclick="location.reload()">ПЕРЕЗАПУСТИТЬ</button>';

animate();
</script>
